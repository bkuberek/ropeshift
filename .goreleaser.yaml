# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
#
# GoReleaser builds a release from its tag on main, and a snapshot from any commit with `make snapshot`.
# docs/releasing.md describes the whole process. The Homebrew formula is not built here: GoReleaser
# deprecated formulas in favor of casks, a cask cannot run under `brew services`, so
# scripts/homebrew-formula.sh renders the project's own template from checksums.txt (ADR-0001).
version: 2

project_name: ropeshift

before:
  hooks:
    # Every build embeds the web UI, which no commit holds, so it is built into web/static first: for a
    # snapshot with the packages already installed, for a release with exactly the ones the lockfile pins.
    - sh scripts/release-ui.sh {{ if .IsSnapshot }}build{{ else }}release{{ end }}

# One binary per platform. Every channel links ropeshiftd to it, and the name a process starts under
# picks the command (D5).
builds:
  - id: ropeshift
    main: ./cmd/ropeshift
    binary: ropeshift
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [arm64, amd64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X ropeshift.dev/ropeshift/internal/version.version=v{{ .Version }}
      - -X ropeshift.dev/ropeshift/internal/version.commit={{ .FullCommit }}
      - -X ropeshift.dev/ropeshift/internal/version.date={{ .Date }}
      - -X ropeshift.dev/ropeshift/internal/version.modified={{ .IsGitDirty }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: archives
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # The archive records no name from the machine that built it.
    builds_info:
      owner: root
      group: root
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE.md
        info:
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"

# Neither package installs a service: `ropeshift service install` writes a systemd user unit for the
# person who runs it.
nfpms:
  - id: packages
    package_name: ropeshift
    vendor: Destiny Ventures Group LLC
    maintainer: Destiny Ventures Group LLC
    license: FSL-1.1-ALv2
    homepage: https://ropeshift.com/
    description: A self-hosted software factory that runs supervised agent CLIs from a work ledger.
    file_name_template: "{{ .ConventionalFileName }}"
    formats: [deb, rpm]
    bindir: /usr/bin
    section: devel
    recommends:
      - git
      - tmux
    contents:
      - src: ropeshift
        dst: /usr/bin/ropeshiftd
        type: symlink
      - src: LICENSE.md
        dst: /usr/share/doc/ropeshift/LICENSE.md
        file_info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: README.md
        dst: /usr/share/doc/ropeshift/README.md
        file_info:
          mode: 0644
          mtime: "{{ .CommitDate }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

# A snapshot's version can never be mistaken for a release: it names the commit it came from, and reads
# no tag, so a commit on main after a release does not take that release's version.
snapshot:
  version_template: "0.0.1-snapshot-{{ .ShortCommit }}"

# The release notes are release-please's: the version's section of CHANGELOG.md, which it puts on the
# release it creates (docs/releasing.md). GoReleaser writes none of its own.
changelog:
  disable: true

# A tag build uploads the artifacts to the release that release-please created for the tag, and keeps
# that release's notes. It marks a version with -alpha, -beta, or -rc as a pre-release, and every other
# version as a release. A snapshot publishes nothing. A second run for the same tag, after one that
# stopped partway, replaces the assets it uploaded, which the build reproduces from the tag.
release:
  github:
    owner: bkuberek
    name: ropeshift
  draft: false
  prerelease: auto
  mode: keep-existing
  replace_existing_artifacts: true
  name_template: "v{{ .Version }}"
