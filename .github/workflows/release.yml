# Releases (ADR-0017, docs/releasing.md). On each push to main, release-please keeps a release pull
# request open with the next version and its changelog. When that pull request is merged, the push of
# the merge runs release-please again: it tags the merge commit v<version> and creates the GitHub
# release, with the version's changelog section as its notes. The publish job then builds the release
# from that tag with GoReleaser, uploads its archives, packages, and checksums to the release, and
# commits the Homebrew formula to the tap.
#
# A tag created with the workflow's own token starts no other workflow, so the publish job runs here,
# after release-please, and only when release-please created a release. It is the only job in the
# production environment, which holds the tap's token and allows deployments from main only.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release-please:
    name: Tag the release, or update the release pull request
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the release, its tag, and release-please's branch
      pull-requests: write # release-please's pull request and its labels
      issues: write # the labels release-please creates
    outputs:
      created: ${{ steps.release-please.outputs.release_created }}
      tag: ${{ steps.release-please.outputs.tag_name }}
      version: ${{ steps.release-please.outputs.version }}
    steps:
      - id: release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish the release
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: write # the release's assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release-please.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          cache: "false"
          node: "true"
          goreleaser: "true"

      # release-please tags the commit where the release pull request merged, which is on main.
      - name: Check that the tag is on main
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          if ! git merge-base --is-ancestor "refs/tags/$TAG" refs/remotes/origin/main; then
            echo "::error::The tag $TAG is not on main"
            exit 1
          fi

      # GoReleaser builds the web UI and every artifact from the tag, and uploads them to the release
      # release-please created, whose notes it keeps.
      - name: Build the release and upload its artifacts with GoReleaser
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ needs.release-please.outputs.tag }}
        run: goreleaser release --clean

      - name: Render the Homebrew formula
        run: sh scripts/homebrew-formula.sh dist/checksums.txt "" dist/homebrew/ropeshift.rb

      # The tap is shared with other tools, so this writes Formula/ropeshift.rb and nothing else. Its
      # token is a secret of the production environment.
      - name: Commit the formula to the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning title=Homebrew tap::HOMEBREW_TAP_GITHUB_TOKEN is not set in the production environment, so the formula was not committed to bkuberek/homebrew-tap. The release is published; docs/releasing.md describes the formula by hand."
            exit 0
          fi
          path=repos/bkuberek/homebrew-tap/contents/Formula/ropeshift.rb
          content=$(base64 -w0 dist/homebrew/ropeshift.rb)
          current=$(GH_TOKEN=$TAP_TOKEN gh api "$path" --jq '.sha + " " + (.content | gsub("\n"; ""))' 2>/dev/null || true)
          sha=${current%% *}
          case $sha in
          *[!0-9a-f]* | "") sha= ;;
          esac
          if [ -n "$sha" ] && [ "${current#* }" = "$content" ]; then
            echo "The tap already holds this formula."
            exit 0
          fi
          args=(--method PUT "$path" -f "message=ropeshift $VERSION" -f "content=$content")
          if [ -n "$sha" ]; then
            args+=(-f "sha=$sha")
          fi
          GH_TOKEN=$TAP_TOKEN gh api "${args[@]}" --jq '"Committed " + .commit.html_url'
