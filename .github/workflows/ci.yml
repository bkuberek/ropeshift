# The checks every pull request to main and every push to main runs (ADR-0017): make check on Linux,
# and on macOS too for a push to main, the nightly run, and a manual run, and on Linux the cross builds,
# the crash tests, an install through every channel, the first work order with no network, and the
# service tests under systemd. The macOS check is three jobs side by side: the contract suite, the other
# Go packages, and everything else make check runs. A push to main also runs the long crash run and the
# bench. Nothing here starts an agent CLI session or holds an agent credential.
#
# A change to Markdown and images only runs no checks: the changes job finds it, every check is skipped,
# and the CI result job still reports, so branch protection can require CI result alone.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      long-chaos:
        description: Also run the long crash run, make chaos KILLS=1500
        type: boolean
        default: false
      bench:
        description: Also run the bench, whose numbers are informational
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: files
        name: Find whether anything but Markdown and images changed
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # A pull request is checked out as its merge commit, whose first parent is the base. A push
          # compares with the commit main held before it. A manual run, a new branch, and a range this
          # cannot read all run every check.
          base=
          case $EVENT in
          pull_request) base=$(git rev-parse HEAD^1) ;;
          push) base=$BEFORE ;;
          esac
          code=true
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            code=false
            while IFS= read -r path; do
              case $path in
              *.md | *.png | *.jpg | *.jpeg | *.gif | *.svg | *.webp | *.ico) ;;
              *) code=true ;;
              esac
            done < <(git diff --name-only "$base" HEAD)
          fi
          echo "code=$code" >>"$GITHUB_OUTPUT"
          echo "Checks run: $code"

  # make check-go on Linux. The web tests run in the web-test job beside this one, so Linux leaves them out.
  check:
    name: make check (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node: "true"
          golangci-lint: "true"
          goreleaser: "true"
          tmux: "true"
      - name: make check-go
        run: make check-go 2>&1 | tee "$RUNNER_TEMP/check.log"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-ubuntu-latest-log
          path: ${{ runner.temp }}/check.log
          retention-days: 14

  # make check on macOS, in three jobs that run side by side, because one job took more than an hour and
  # a half on a busy runner. Together they run what make check runs. A push to main, the nightly run, and
  # a manual run have them; a pull request does not, so a pull request runs Linux alone and a macOS break
  # surfaces on main within a day. Packages run in parallel under -race, so the contract suite, the
  # slowest package at about 30 to 45 minutes, runs alone and the other packages share a job.
  #
  # The contract suite (./test/contract/...). The timeout sits past the slowest run seen, which was close
  # to 45 minutes.
  macos-contract:
    name: make test, contract suite (macos-latest)
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node: "true"
          golangci-lint: "true"
          goreleaser: "true"
          tmux: "true"
      - name: make test, contract suite
        run: make test canary GO_TEST_PKGS=./test/contract/... TEST_TIMEOUT=60m 2>&1 | tee "$RUNNER_TEMP/macos-contract.log"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-contract-log
          path: ${{ runner.temp }}/macos-contract.log
          retention-days: 14

  # Every Go package but the contract suite, the list taken from go list so a new package joins it. The
  # slowest are the worker and the exit tests, at 25 to 40 minutes on a busy runner.
  macos-go:
    name: make test, other packages (macos-latest)
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node: "true"
          golangci-lint: "true"
          goreleaser: "true"
          tmux: "true"
      - name: make test, every package but the contract suite
        run: |
          # make reads the list from one line, so the import paths are joined with spaces.
          packages=$(go list ./... | grep -v -E '/test/contract(/|$)' | tr '\n' ' ')
          if [ -z "$packages" ]; then
            echo "::error::go list found no package outside the contract suite"
            exit 1
          fi
          make test canary GO_TEST_PKGS="$packages" TEST_TIMEOUT=50m 2>&1 | tee "$RUNNER_TEMP/macos-go.log"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-go-log
          path: ${{ runner.temp }}/macos-go.log
          retention-days: 14

  # Formatting, vet, lint, the web tests and typecheck, the license check, and the release configuration
  # check: make check without its Go tests. The web tests take 30 to 40 minutes, so they run here against
  # macOS's Chrome, beside the Go tests of the other two jobs.
  macos-rest:
    name: make check-rest (macos-latest)
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node: "true"
          golangci-lint: "true"
          goreleaser: "true"
          tmux: "true"
      - name: make check-rest
        run: make check-rest 2>&1 | tee "$RUNNER_TEMP/macos-rest.log"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-rest-log
          path: ${{ runner.temp }}/macos-rest.log
          retention-days: 14

  # The web application's typecheck and tests (make web-test), apart from the Go checks, so the two run
  # side by side. The tests read the goldens committed under web/testdata and start no Go, so the job
  # sets up Node alone. The browser tests use the Google Chrome that the ubuntu-latest image ships.
  web-test:
    name: make web-test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: make web-test
        run: make web-test 2>&1 | tee "$RUNNER_TEMP/web-test.log"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-test-log
          path: ${{ runner.temp }}/web-test.log
          retention-days: 14

  cross:
    name: make cross
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: make cross
        run: make cross 2>&1 | tee "$RUNNER_TEMP/cross.log"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cross-log
          path: ${{ runner.temp }}/cross.log
          retention-days: 14

  chaos:
    name: make chaos
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tmux: "true"
      - name: make chaos
        run: make chaos 2>&1 | tee "$RUNNER_TEMP/chaos.log"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chaos-log
          path: ${{ runner.temp }}/chaos.log
          retention-days: 14

  # The store contract suite on a private Postgres, and the Postgres adapter's own tests (NFR-TEST-2). A
  # failure here is a dialect defect in the pull request that caused it. The ubuntu-latest image ships
  # PostgreSQL's binaries without starting a server, and the suite starts its own on a unix socket, so the
  # job takes initdb and postgres from the image and installs the distribution's package only when the
  # image has none.
  postgres:
    name: make check-postgres
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Find the PostgreSQL binaries
        run: |
          find_bin() {
            local found=
            for dir in $(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V); do
              if [ -x "$dir/initdb" ] && [ -x "$dir/postgres" ]; then found=$dir; fi
            done
            echo "$found"
          }
          bin=$(find_bin)
          source="the runner image"
          if [ -z "$bin" ]; then
            sudo apt-get update --quiet
            sudo apt-get install --yes --quiet --no-install-recommends postgresql
            bin=$(find_bin)
            source="the distribution's package"
          fi
          if [ -z "$bin" ]; then
            echo "::error::No PostgreSQL binaries on the runner"
            exit 1
          fi
          echo "ROPESHIFT_TEST_PG_BIN=$bin" >>"$GITHUB_ENV"
          echo "PostgreSQL from $source: $("$bin/postgres" --version)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: make check-postgres
        run: make check-postgres 2>&1 | tee "$RUNNER_TEMP/postgres.log"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: postgres-log
          path: ${{ runner.temp }}/postgres.log
          retention-days: 14

  # The snapshot the install and exit jobs test, built once. The archive keeps the file modes that an
  # artifact alone would drop.
  snapshot:
    name: make snapshot
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node: "true"
          goreleaser: "true"
      - name: make snapshot
        run: make snapshot 2>&1 | tee "$RUNNER_TEMP/snapshot.log"
      - name: Pack the snapshot
        run: tar -czf "$RUNNER_TEMP/snapshot.tar.gz" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot
          path: ${{ runner.temp }}/snapshot.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-log
          path: ${{ runner.temp }}/snapshot.log
          retention-days: 14

  install-test:
    name: make install-test
    needs: [changes, snapshot]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node: "true"
          goreleaser: "true"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snapshot
          path: ${{ runner.temp }}
      - name: Unpack the snapshot
        run: tar -xzf "$RUNNER_TEMP/snapshot.tar.gz"
      - name: make install-test
        run: make install-test INSTALL_DIST=dist 2>&1 | tee "$RUNNER_TEMP/install-test.log"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-test-log
          path: ${{ runner.temp }}/install-test.log
          retention-days: 14

  exit-container:
    name: make exit-container
    needs: [changes, snapshot]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snapshot
          path: ${{ runner.temp }}
      - name: Unpack the snapshot
        run: tar -xzf "$RUNNER_TEMP/snapshot.tar.gz"
      - name: make exit-container
        run: make exit-container EXIT_DIST=dist 2>&1 | tee "$RUNNER_TEMP/exit-container.log"
      # These tests skip with no Docker or no snapshot, and a skip here would prove nothing.
      - name: Require that every test ran
        run: |
          if grep -E -- '--- SKIP' "$RUNNER_TEMP/exit-container.log"; then
            echo "::error::An exit test skipped, so the run proves nothing"
            exit 1
          fi
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exit-container-log
          path: ${{ runner.temp }}/exit-container.log
          retention-days: 14

  service:
    name: Service tests under systemd
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: make service-container
        run: make service-container SERVICE_OUT="$RUNNER_TEMP/service" 2>&1 | tee "$RUNNER_TEMP/service.log"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: service-log
          path: |
            ${{ runner.temp }}/service.log
            ${{ runner.temp }}/service/results.txt
            ${{ runner.temp }}/service/logs
            ${{ runner.temp }}/service/journal.txt
          retention-days: 14

  chaos-long:
    name: make chaos KILLS=1500
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'push' || inputs.long-chaos)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tmux: "true"
      - name: make chaos KILLS=1500
        run: make chaos KILLS=1500 2>&1 | tee "$RUNNER_TEMP/chaos-long.log"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chaos-long-log
          path: ${{ runner.temp }}/chaos-long.log
          retention-days: 14

  # Shared runners give noisy timings, so the bench never fails the run. NFR-PERF-1 and NFR-PERF-2 are
  # proven on known machines, and these numbers are kept in the job summary.
  bench:
    name: make bench (informational)
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'push' || inputs.bench)
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tmux: "true"
      - name: make bench
        run: make bench 2>&1 | tee "$RUNNER_TEMP/bench.log"
      - name: Keep the numbers in the job summary
        if: always()
        run: |
          {
            echo "### Bench on a shared runner"
            echo
            echo "Shared runners give noisy timings, so these numbers are informational."
            echo
            echo '```text'
            grep -E -- '_test\.go:[0-9]+:|^ *--- |^(ok|FAIL|PASS)' "$RUNNER_TEMP/bench.log" || echo "The bench printed no results."
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-log
          path: ${{ runner.temp }}/bench.log
          retention-days: 14

  # The one check branch protection requires. It passes when every check passed or was skipped, so a
  # change to Markdown and images only reports a result too. The bench is informational and left out.
  # On a pull request the three macOS jobs are skipped, which counts as passed, so the Linux check alone
  # gates it. On main, a failure of any macOS job fails CI result.
  result:
    name: CI result
    if: always()
    needs: [changes, check, macos-contract, macos-go, macos-rest, web-test, cross, chaos, postgres, snapshot, install-test, exit-container, service, chaos-long]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require that every check passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            case $result in
            success | skipped) ;;
            *)
              echo "::error::A check ended as $result"
              exit 1
              ;;
            esac
          done
