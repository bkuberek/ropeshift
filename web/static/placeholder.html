  <body>
    <h1>ropeshift</h1>
    <p>This binary was built from a tree with no web build, so the web UI is not in it. Every operation is available from the <code>ropeshift</code> command.</p>
    <p>To build the UI, run <code>npm --prefix web ci</code> and <code>npm --prefix web run build</code>, then build the binary again. A released binary needs none of this.</p>
  </body>
